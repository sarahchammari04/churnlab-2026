[project]
name = "churnlab"
version = "0.1.0"
description = "Reproducible IBM Telco customer churn project (ESILV MLOps)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas~=2.2.0",
    "numpy~=1.26.0",
    "scikit-learn~=1.5.0",
    "mlflow>=3,<4",
]

[project.optional-dependencies]
tensorflow = ["tensorflow~=2.16.0"]
kubeflow = ["kfp~=2.7.0"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest~=8.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E4/E7/E9: import, statement and syntax errors; F: Pyflakes; I: import sorting
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["churnlab"]

[tool.coverage.run]
source_pkgs = ["churnlab"]

[tool.coverage.paths]
# Tests import the installed copy (--no-editable on macOS): report it as src/churnlab.
churnlab = ["src/churnlab", "*/site-packages/churnlab"]
