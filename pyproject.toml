[project]
name = "churnlab"
version = "0.1.0"
description = "Reproducible IBM Telco customer churn project (ESILV MLOps)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas~=2.2.0",
    "numpy~=1.26.0",
    "scikit-learn~=1.5.0",
]

[project.optional-dependencies]
tensorflow = ["tensorflow~=2.16.0"]
kubeflow = ["kfp~=2.7.0"]

[dependency-groups]
dev = ["pytest~=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
